/* ===== Q弹圆润主题 v9 ===== */
:root{
  --ink:#2a2f3a;
  --ink-2:#5b6373;
  --paper:#f3f1e6;
  --card:#fffdf5;
  --line:#2a2f3a;
  --grass:#6cc25a;
  --grass-d:#4f9e40;
  --sky:#8ed0ee;
  --sky-d:#63b3da;
  --brick:#e0704f;
  --gold:#f4c95d;
  --red:#d9523c;
  --green:#2f8a58;
  --r-sm:10px;
  --r:16px;
  --r-lg:24px;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --soft:0 6px 0 rgba(42,47,58,.10), 0 10px 22px rgba(42,47,58,.10);
  --soft-sm:0 3px 0 rgba(42,47,58,.10), 0 6px 14px rgba(42,47,58,.10);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:15.5px/1.75 "KuaiLe",ui-rounded,"PingFang SC","Microsoft Yahei",sans-serif;
  letter-spacing:.3px;
  background-image:
    radial-gradient(circle at 20% 10%, #ffffff88 0 2px, transparent 2px),
    repeating-linear-gradient(0deg,transparent 0 27px,#00000006 27px 28px),
    repeating-linear-gradient(90deg,transparent 0 27px,#00000006 27px 28px);
}

/* 顶栏 */
header{
  position:relative;display:flex;gap:14px;justify-content:space-between;align-items:center;
  padding:15px max(18px,calc((100vw - 1040px)/2)) 20px;
  color:#10344a;
  background-image:linear-gradient(180deg,var(--sky),var(--sky-d));
  border-bottom:2.5px solid var(--ink);
  border-radius:0 0 var(--r-lg) var(--r-lg);
  box-shadow:0 8px 20px rgba(42,47,58,.12);
}
h1{font-size:20px;margin:0;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 0 #ffffff77}
.header-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto}
.hs-row{display:flex;align-items:center;gap:8px}
.today{font-size:13px;font-weight:700;letter-spacing:1px}
.tag{font-size:11px;opacity:.7;letter-spacing:1px}.sound-btn{
  flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;
  font-size:12px;line-height:1;padding:4px 7px;cursor:pointer;box-shadow:var(--soft-sm);
  transition:transform .2s var(--pop);
}
.sound-btn:hover{transform:scale(1.08) rotate(-4deg)}
.sound-btn:active{transform:scale(.92)}

h1,h2,.city-name,.building b,.part-main b,.form-title,.list-title,
.save,.city-tab,.back,.toolbar button,.toolbar label,.modal h3,.recurring-item .del{
  font-family:'KuaiLe',ui-rounded,"PingFang SC",sans-serif;font-weight:400;
}
.value,.amount,.stat strong,.pop-big,.pop-sub,.today,.countdown,.modal-amount,.part-value{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
  font-variant-numeric:tabular-nums;
}
input,select,textarea,small,label,.tag,.hint,.stat span,.stat em,.pop-mood,.modal-ask,
.entry label,.recurring-item,.kept-item,.event-item,.ev-left,.pop-sub{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
}
main{max-width:1040px;margin:auto;padding:26px 18px 64px}

/* 城市名 */
.intro{text-align:center;margin:14px 0 22px}
.city-name{
  display:block;width:min(100%,440px);margin:0 auto 6px;padding:6px 14px;
  border:2px solid transparent;background:transparent;color:var(--ink);
  font:inherit;font-size:26px;font-weight:700;text-align:center;letter-spacing:2px;
  border-radius:var(--r);
  transition:transform .2s var(--pop),background .2s,border-color .2s;
}
.city-name:hover,.city-name:focus{
  border-color:var(--ink);background:var(--card);outline:none;transform:scale(1.02);box-shadow:var(--soft-sm);
}
.intro p,.desc,.hint{color:var(--ink-2);margin:0;font-size:12px}

/* 城邦底座 */
.city{
  padding:20px;border:2.5px solid var(--ink);border-radius:var(--r-lg);
  background:linear-gradient(180deg,#d8eec0,#c8e3ab);
  box-shadow:var(--soft), inset 0 -6px 0 #b6d59a;
}

/* 建筑卡片 */
.buildings{display:flex;flex-wrap:wrap;gap:16px;margin-top:6px}.building{
  flex:1 1 30%;min-width:230px;position:relative;display:flex;flex-direction:column;
  border:2px solid var(--ink);border-radius:20px;background:var(--card);
  min-height:132px;padding:14px 16px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;
  box-shadow:var(--soft);
  transition:transform .22s var(--pop),box-shadow .22s var(--pop),background .2s;
}
body.fresh .building{animation:popIn .32s var(--pop) both}
body.fresh .building:nth-child(2){animation-delay:.05s}
body.fresh .building:nth-child(3){animation-delay:.1s}
body.fresh .building:nth-child(4){animation-delay:.15s}
body.fresh .building:nth-child(5){animation-delay:.2s}
@keyframes popIn{from{transform:scale(.94) translateY(8px)}to{transform:scale(1) translateY(0)}}
.building:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 10px 0 rgba(42,47,58,.10),0 16px 28px rgba(42,47,58,.16);background:#fffef9}
.building:active{transform:scale(.97);box-shadow:0 2px 0 rgba(42,47,58,.12)}.building i{
  font-style:normal;font-size:28px;display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;line-height:1;margin-bottom:10px;background:#eff7e3;
  border:2px solid var(--ink);border-radius:14px;
  transition:transform .25s var(--pop);
}
.building:hover i{transform:rotate(-6deg) scale(1.06)}
.building b{font-size:16px;display:block;letter-spacing:.5px}
.building small{color:var(--ink-2);display:block;margin-top:2px;font-size:11px;letter-spacing:.5px}
.building .value{
  margin-top:auto;padding-top:10px;border-top:1.5px dashed #ded9c4;
  font-weight:700;font-size:17px;color:var(--green);font-variant-numeric:tabular-nums;
}
.building.market .value{color:var(--red)}.building .badge{
  position:absolute;top:-12px;right:10px;background:var(--red);color:#fff;
  font-size:10px;padding:3px 9px;border:2px solid var(--ink);border-radius:999px;letter-spacing:1px;
  animation:badgeBounce 1.8s var(--pop) infinite;
}
@keyframes badgeBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.note{
  margin:18px 0 0;background:#fff8dd;border:2px solid var(--ink);border-radius:var(--r);
  padding:11px 14px;color:#6b5310;font-size:13px;box-shadow:var(--soft-sm);
}

/* 详情 */
.view{display:none}.view.active{display:block}.back{
  background:var(--card);border:2px solid var(--ink);border-radius:999px;color:var(--ink);
  font:inherit;font-size:13px;padding:7px 16px;cursor:pointer;margin-bottom:14px;
  box-shadow:var(--soft-sm);transition:transform .2s var(--pop);
}
.back:hover{transform:translateX(-3px) scale(1.03)}
.back:active{transform:scale(.95)}.panel{
  background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--soft);
}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{margin:0;font-size:21px;letter-spacing:1.5px}.month,.monthbar button{
  border:2px solid var(--ink);background:#fff;border-radius:12px;padding:7px 10px;
  font:inherit;font-size:13px;color:var(--ink);box-shadow:var(--soft-sm);
  transition:transform .2s var(--pop);
}
.monthbar{display:flex;align-items:center;gap:6px}.monthbar button{cursor:pointer;width:36px;height:38px;line-height:1;border-radius:999px}
.monthbar button:hover{transform:scale(1.1)}
.monthbar button:active{transform:scale(.9)}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{border:2px solid var(--ink);background:#fffdf2;border-radius:var(--r);padding:13px;box-shadow:var(--soft-sm)}
.stat span{font-size:11px;color:var(--ink-2);display:block;letter-spacing:1px}
.stat strong{font-size:19px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:11px;color:var(--ink-2)}
.income{color:var(--green)}.expense{color:var(--red)}

/* 表单 */
.entry-card{margin-bottom:18px}
.form-title{font-weight:700;margin-bottom:10px;letter-spacing:1px;font-size:14px}
.tax-event{display:inline-block;margin-left:8px;font-weight:400;font-size:12px;color:var(--green)}
.entry{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.entry .wide{grid-column:1/-1}
.entry.compact{grid-template-columns:1fr 1fr}
.entry label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:5px;letter-spacing:1px}.entry input,.entry select{
  width:100%;border:2px solid var(--ink);background:#fff;border-radius:13px;
  padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);
  transition:transform .18s var(--pop),box-shadow .18s,background .18s;
}
.entry input:focus,.entry select:focus{
  outline:none;background:#fffdf0;box-shadow:var(--soft-sm);transform:scale(1.01);
}.save{
  grid-column:1/-1;border:2px solid var(--ink);border-radius:999px;
  background:linear-gradient(180deg,#7ad167,var(--grass));color:#13300c;
  font:inherit;font-weight:700;font-size:14px;padding:11px;cursor:pointer;letter-spacing:2px;
  box-shadow:var(--soft);transition:transform .2s var(--pop),box-shadow .2s;
}
.save:hover{transform:translateY(-2px) scale(1.01)}
.save:active{transform:scale(.96);box-shadow:var(--soft-sm)}
.recurring-toggle{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.recurring-toggle input{width:auto}

/* 列表 */
.list-title{font-weight:700;margin:18px 0 10px;letter-spacing:1px;font-size:13px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden;border-radius:var(--r)}
th{text-align:left;font-size:11px;color:var(--ink-2);padding:8px;border-bottom:1.5px solid #ded9c4;letter-spacing:1px}
td{padding:10px 8px;border-bottom:1.5px dashed #e0dcc9}
tr:hover td{background:#fffbe9}
.amount{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}.del{
  border:2px solid var(--ink);background:#fff;color:var(--red);cursor:pointer;
  width:28px;height:28px;line-height:1;font-size:15px;border-radius:999px;box-shadow:var(--soft-sm);
  transition:transform .2s var(--pop);
}
.del:hover{transform:scale(1.12) rotate(8deg)}
.del:active{transform:scale(.9)}
.empty{border:2px dashed #cbc7b3;border-radius:var(--r);padding:24px;text-align:center;color:var(--ink-2);font-size:13px;background:#fffdf5}
.hint{font-size:11px;margin-top:16px;color:var(--ink-2)}

/* part */
.part-block{border:2px solid var(--ink);border-radius:2px;background:var(--card);margin-bottom:12px;box-shadow:var(--soft-sm);overflow:hidden;transition:box-shadow .2s,transform .2s var(--pop)}
.part-block.open{box-shadow:var(--soft)}
.part{
  display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;
  padding:15px 18px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;
  transition:background .18s;
}
.part:hover{background:#fffbe9}
.part-main{display:flex;flex-direction:column;gap:2px;flex:1}
.part-main b{font-size:14px;letter-spacing:1px}
.part-main small{color:var(--ink-2);font-size:11px}
.part-value{font-weight:700;color:var(--green);font-size:16px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.part-value em{font-style:normal;color:var(--ink-2);font-size:11px;font-weight:400}
.part-caret{color:var(--ink);font-size:12px;width:14px;text-align:center;transition:transform .25s var(--pop)}
.part-block.open .part-caret{transform:rotate(90deg)}
.part-panel{border-top:2px solid var(--ink);padding:16px 18px 20px;background:#fffdf2;animation:panelDrop .26s var(--pop)}
@keyframes panelDrop{from{transform:scaleY(.92);opacity:0;transform-origin:top}to{transform:scaleY(1);opacity:1}}

/* 例行 */
.recurring-list{border:2px solid var(--ink);border-radius:var(--r);background:#fff;margin-bottom:14px;overflow:hidden}
.recurring-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 13px;font-size:12px;border-top:1.5px dashed #e0dcc9}
.recurring-item:first-child{border-top:0}
.recurring-item .del{width:auto;padding:0 10px;height:26px}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:2px dashed #ded9c4}.toolbar button,.toolbar label{
  border:2px solid var(--ink);border-radius:999px;background:#fff;padding:8px 14px;
  font:inherit;font-size:12px;color:var(--ink);cursor:pointer;box-shadow:var(--soft-sm);
  letter-spacing:1px;transition:transform .2s var(--pop);
}
.toolbar button:hover,.toolbar label:hover{transform:translateY(-2px) scale(1.03)}
.toolbar button:active,.toolbar label:active{transform:scale(.95)}
.toolbar .danger{color:var(--red)}

/* 犹豫 */
.hes-item{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:2px solid var(--ink);border-radius:2px;background:#fff;padding:13px 15px;margin-bottom:10px;
  box-shadow:var(--soft-sm);transition:transform .2s var(--pop);
}
.hes-item:hover{transform:translateY(-2px)}
.hes-item.due{border-color:var(--red);background:#fff4f0;animation:duePulse 1.4s var(--pop) infinite}
@keyframes duePulse{0%,100%{box-shadow:var(--soft-sm)}50%{box-shadow:0 0 0 5px #f2b8a944,var(--soft-sm)}}
.hes-main b{display:block;font-size:14px;letter-spacing:.5px}
.hes-main small{color:var(--ink-2);font-size:11px}
.hes-side{display:flex;align-items:center;gap:8px;flex-shrink:0}
.countdown{font-variant-numeric:tabular-nums;color:var(--green);font-weight:700;font-size:12px;white-space:nowrap}
.due-tag{color:var(--red)}.btn{
  border:2px solid var(--ink);border-radius:999px;background:#fff;padding:7px 14px;
  font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--soft-sm);
  transition:transform .2s var(--pop);
}
.btn:hover{transform:translateY(-2px) scale(1.04)}
.btn:active{transform:scale(.93)}
.btn.tiny{padding:4px 10px;font-size:11px;box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#7ad167,var(--grass));color:#13300c;font-weight:700}
.btn.no{background:#ffe3da;color:var(--red)}
.kept-list{border:2px solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden}
.kept-item{display:flex;justify-content:space-between;padding:9px 13px;font-size:12px;border-top:1.5px dashed #e0dcc9}
.kept-item:first-child{border-top:0}
.dur{display:flex;gap:6px}
.dur input{flex:1}
.dur select{width:84px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:#232a3766;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}.modal{
  background:var(--card);border:2.5px solid var(--ink);border-radius:26px;padding:24px 20px;
  max-width:340px;width:100%;box-shadow:0 18px 40px rgba(42,47,58,.28);text-align:center;
  animation:modalPop .34s var(--pop);
}
@keyframes modalPop{from{transform:scale(.86) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h3{margin:0 0 12px;font-size:15px;letter-spacing:1px}
.modal-title{font-size:14px;margin:6px 0 2px}
.modal-amount{font-size:26px;font-weight:700;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.modal-ask{color:var(--ink-2);font-size:12px;margin:0 0 16px;line-height:1.6}
.modal-actions{display:flex;flex-direction:column;gap:9px}.modal-actions .btn{padding:11px;font-size:13px;border-radius:999px}.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#ffe9a8;padding:11px 20px;font-size:13px;letter-spacing:1px;
  border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:99;
  animation:toastPop .3s var(--pop);
}
@keyframes toastPop{from{transform:translate(-50%,14px) scale(.9);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}


/* 数据状态 */
.building.danger{border-color:var(--red);background:#fff3ef}
.building.danger .value{color:var(--red)}
.building.danger{animation:tremble .32s steps(2) 3}
@keyframes tremble{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px) rotate(-.4deg)}100%{transform:translate(0,0)}}
.building.good{border-color:#7bbf6a}
.building.idle{filter:grayscale(.45);opacity:.88}
.building.pulse{animation:pulseRing 1.8s var(--pop) infinite}
@keyframes pulseRing{0%,100%{box-shadow:var(--soft)}50%{box-shadow:0 0 0 6px #f4c95d44,var(--soft)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* 人口 / MY CITY */
.city-tab{border:2px solid var(--ink);background:#fff;border-radius:2px;padding:6px 14px;font:inherit;font-size:12px;letter-spacing:1px;cursor:pointer;box-shadow:var(--soft-sm);transition:transform .2s var(--pop)}
.city-tab:hover{transform:translateY(-2px) scale(1.05)}
.city-tab:active{transform:scale(.93)}.popbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--ink);border-radius:20px;background:var(--card);padding:13px 18px;margin:0 0 16px;box-shadow:var(--soft-sm);transition:border-color .3s,background .3s}
.popbar.up{border-color:#7bbf6a}
.popbar.down{border-color:var(--red);background:#fff4f0}
.pop-left{display:flex;align-items:center;gap:12px}
.pop-icon{font-size:26px}
.pop-left b{display:block;font-size:17px}
.pop-left small{color:var(--ink-2);font-size:11px}
.pop-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pop-mood{font-size:12px;color:var(--ink-2)}.city-link{border:2px solid var(--ink);background:var(--gold);border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;cursor:pointer;box-shadow:var(--soft-sm);transition:transform .2s var(--pop)}
.city-link:hover{transform:translateY(-2px) scale(1.05)}
.city-link:active{transform:scale(.93)}.pop-hero{text-align:center;padding:20px;border:2px solid var(--ink);border-radius:22px;background:#f4fbf0;margin-bottom:16px}
.pop-hero.down{background:#fff4f0;border-color:var(--red)}
.pop-big{font-size:44px;font-weight:700;letter-spacing:1px;line-height:1.1;font-variant-numeric:tabular-nums}
.pop-sub{color:var(--ink-2);font-size:12px;margin-top:2px}
.pop-trend{margin-top:8px;font-size:13px}
.event-list{border:2px solid var(--ink);border-radius:var(--r);background:#fff;overflow:hidden}
.event-item{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;font-size:12px;border-top:1.5px dashed #e0dcc9}
.event-item:first-child{border-top:0}
.ev-left{color:var(--ink-2)}
.ev-right{font-weight:700;white-space:nowrap}
@media(max-width:620px){.pop-big{font-size:34px}.popbar{padding:12px 14px}}

@media(max-width:900px){
  .buildings{display:grid;grid-template-columns:repeat(2,1fr)}
  .entry{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .buildings{grid-template-columns:1fr}
  .entry,.entry.compact{grid-template-columns:1fr}.city{padding:14px;border-radius:var(--r-lg)}.panel{padding:14px;border-radius:20px}
  header{padding:14px;border-radius:0 0 18px 18px}
  h1{font-size:15px}
  table{font-size:12px}
  .hes-item{flex-direction:column;align-items:flex-start}
}


/* 对话式犹豫支出 */
.chat{display:flex;flex-direction:column;gap:9px;margin:4px 0 20px}.bubble{max-width:78%;padding:10px 16px;border-radius:20px;font-size:14.5px;line-height:1.5;background:#eef4e4;border:1.5px solid #dbe3cf;align-self:flex-start}
.bubble.me{align-self:flex-end;background:#e6f2fd;border-color:#cfe2f4}
.chat-input form{display:flex;gap:8px}.chat-input input{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;font:inherit;background:#fff}
.chat-input input:focus{outline:none;background:#fffdf0;box-shadow:var(--soft-sm)}.chat-input button{flex:none;border:1.5px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#7ad167,var(--grass));padding:0 22px;font:inherit;font-size:16px;cursor:pointer;box-shadow:var(--soft-sm)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer;box-shadow:var(--soft-sm);transition:transform .2s var(--pop)}
.chips button:hover{transform:translateY(-2px)}
.chips button.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.hes-summary{font-size:12px;color:var(--ink-2);margin:0 0 16px}.hes-item{border:0;border-bottom:1.5px solid #e8e4d4;border-radius:18px;box-shadow:none;background:transparent;padding:13px 2px;margin:0}
.hes-item:hover{transform:none}.hes-item.due{background:#fff6f2;border-radius:12px;padding:13px 12px;border-bottom-color:transparent}

/* 黑市单行录入 */
.quick{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;width:100%}.quick input{border:1.5px solid var(--line);border-radius:14px;padding:11px 10px;font:inherit;background:#fff;min-width:0}
.quick input[name=amount]{flex:0 0 96px;text-align:right;padding-right:8px}
.quick input[name=note]{flex:1 1 auto;min-width:60px}
.quick input[name=date]{flex:0 0 132px;padding-left:6px;padding-right:4px}
.quick input:focus{outline:none;background:#fffdf0;box-shadow:var(--soft-sm)}.quick .save{flex:0 0 auto;width:auto;grid-column:auto;padding:0 14px;border-radius:14px;height:46px}
@media(max-width:620px){
  .quick{gap:4px}.quick input{padding:9px 6px;font-size:13px;border-radius:12px}
  .quick input[name=amount]{flex:0 0 68px}
  .quick input[name=date]{flex:0 0 104px;font-size:11px}.quick .save{padding:0 9px;font-size:13px;height:42px;border-radius:12px}
}
@media(max-width:480px){
  .quick input[name=amount]{flex:0 0 56px;font-size:12px}
  .quick input[name=date]{flex:0 0 92px;font-size:10px;padding:8px 3px}
  .quick input[name=note]{font-size:12px;padding:8px 5px}
  .quick .save{padding:0 7px;height:38px;font-size:12px;letter-spacing:0}
}

/* 民生建设 */
.fac-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:9px}
.fac{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--r);background:#fffdf5;padding:12px 14px}
.fac-icon{font-size:24px;line-height:1.2}
.fac-main{flex:1;min-width:0}
.fac-head{display:flex;align-items:baseline;gap:8px}
.fac-head b{font-size:14px}
.fac-head em{font-style:normal;font-size:11px;color:var(--green);background:#e8f5e0;border-radius:999px;padding:1px 8px}
.fac-main small{display:block;color:var(--ink-2);font-size:11px;margin:2px 0 7px}
.fac-bar{height:8px;border-radius:999px;background:#ece9d8;overflow:hidden}
.fac-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8bd273,var(--grass));transition:width .5s var(--pop)}
.fac-next{display:block;font-size:10px;color:var(--ink-2);margin-top:4px}
@media(max-width:820px){.fac-list{grid-template-columns:1fr}}

/* 城邦评分 */
.score-card{border:2px solid var(--line);border-radius:var(--r);background:#fffdf5;padding:16px 18px;margin:2px 0 16px;display:flex;flex-direction:column;gap:6px}
.score-main{display:flex;align-items:baseline;gap:10px;justify-content:center}
.score-num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score-grade{font-size:14px;font-weight:700;color:#fff;border-radius:8px;padding:1px 9px}
.grade-S{background:#e0a020}.grade-A{background:var(--green)}.grade-B{background:#4f8fd0}.grade-C{background:#b0842f}.grade-D{background:var(--red)}
.score-label{text-align:center;font-size:12px;color:var(--ink-2);letter-spacing:1px;margin-bottom:6px}
.score-parts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

<script>
const $ = id => document.getElementById(id);
const money = n => '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, '0');

// 一律按北京时间（UTC+8）算，跟设备所在时区无关
function beijingNow() {
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
}
function beijingISO() {
  const t = beijingNow();
  return t.y + '-' + pad(t.m) + '-' + pad(t.d);
}
const todayISO = beijingISO;
const uid = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);

// 有些浏览器（无痕模式、微信内置浏览器）会禁止 localStorage，这里做内存兜底
const storage = (() => {
  try {
    const k = '__probe__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return window.localStorage;
  } catch (e) {
    const mem = {};
    return {
      getItem: k => (k in mem ? mem[k] : null),
      setItem: (k, v) => { mem[k] = String(v); },
      removeItem: k => { delete mem[k]; },
      __fallback: true
    };
  }
})();

const KEY = {
  entries: 'where_is_my_money_entries',
  recurring: 'where_is_my_money_recurring',
  city: 'where_is_my_money_city_name',
  hesitate: 'where_is_my_money_hesitations',
  saved: 'where_is_my_money_saved'
};

function loadJSON(key, fallback) {
  try {
    const raw = storage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

let entries = loadJSON(KEY.entries, loadJSON('xiaozhangben_entries', []));
let recurring = loadJSON(KEY.recurring, []);
let hesitations = loadJSON(KEY.hesitate, []);
let savedMoney = loadJSON(KEY.saved, []);
let mode = '';
let taxEvent = '';
const activeParts = { tavern: '', homes: '' };  // 空 = 收起状态

const TAVERN_CATS = ['本邦建设', '跨邦交流', '例行建设'];
const HOMES_CATS = ['工资', '兼职', '其他收入'];
const PARTS = { tavern: TAVERN_CATS, homes: HOMES_CATS };
// 展开后还能再选一层细类的 part
const PART_SUBCATS = { '其他收入': ['红包', '理财', '礼金', '其他'] };

const PART_SUB = {
  '本邦建设': '给自己',

};

];

/* ---------- 音效 ---------- */

const SOUND_KEY = 'wsm_sound_on';
let soundOn = storage.getItem(SOUND_KEY) !== '0';
let audioCtx = null;

function ac() {
  try {
    if (!audioCtx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      audioCtx = new C();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch (e) {
    return null;
  }
}

function tone(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  const ctx = ac();
  if (!ctx) return;
  try {
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(vol || 0.04, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
  } catch (e) { /* 音效失败不影响功能 */ }
}

// 返回时的「咻」：噪声经带通滤波从高频扫到低频
function whoosh() {
  if (!soundOn) return;
  const ctx = ac();
  if (!ctx) return;
  try {
    const dur = 0.24;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const env = Math.sin(Math.PI * (i / len));
      data[i] = (Math.random() * 2 - 1) * Math.pow(env, 1.4);
    }
    const t0 = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(2600, t0);
    bp.frequency.exponentialRampToValueAtTime(420, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.4, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start(t0);
  } catch (e) { /* 静默失败 */ }
}

// 悬停时的极短「嗒」：低频噪声 + 一点闷响，不刺耳
function hoverTick() {
  if (!soundOn) return;
  const ctx = ac();
  if (!ctx) return;
  try {
    const dur = 0.022;
    const len = Math.max(8, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    }
    const t0 = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = buf;

    // 带通放在中低频，去掉刺耳的高频
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 720;
    bp.Q.value = 0.9;

    // 再补一个低通，把残余的高频压掉
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1600;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.17, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(bp).connect(lp).connect(g).connect(ctx.destination);
    src.start(t0);

    // 一点点木质闷响
    const osc = ctx.createOscillator();
    const og = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, t0);
    og.gain.setValueAtTime(0.05, t0);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
    osc.connect(og).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.04);
  } catch (e) { /* 静默失败 */ }
}

function save() {

// 老版本用的是「本市建设 / 跨市建设」，读到就顺手改名
(function migrate() {
  const map = { '本市建设': '本邦建设', '跨市建设': '跨邦交流', '投资': '其他收入', '礼金': '其他收入', '其他': '其他收入' };
  let changed = false;
  entries.forEach(e => { if (map[e.category]) { e.category = map[e.category]; changed = true; } });
  if (changed) save();
})();

function monthEntries(month) {
  ensureRecurring(month);
  return entries.filter(x => (x.date || '').startsWith(month));
}

function ensureRecurring(month) {
  let changed = false;
  recurring.forEach((r, i) => {
    if (month < r.startMonth) return;
    if (entries.some(x => x.recurringId === r.id && (x.date || '').startsWith(month))) return;
    const [y, m] = month.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const date = month + '-' + pad(Math.min(r.day, days));
    entries.push({ id: uid() + i, type: 'expense', amount: r.amount, category: '例行建设', date, note: r.note, recurringId: r.id });
    changed = true;
  });
  if (changed) save();
}

const total = arr => arr.reduce((s, x) => s + Number(x.amount || 0), 0);
const sumCat = (arr, cat) => total(arr.filter(x => x.category === cat && x.type === 'expense'));
const cityTotal = arr => total(arr.filter(x => x.type === 'expense' && TAVERN_CATS.includes(x.category)));

/* ---------- 黑市：单行记账 ---------- */

  };

  save();
  render();
}

/* ---------- 人口 ---------- */

const POP_BASE = 1000000;
const POP_RATE = { income: 500, build: 1000, black: 2000 };

function popKind(e) {
  if (e.type === 'income') return 'income';
  if (e.category === '购物') return 'black';
  return 'build';
}

function popDelta(e) {
  const amount = Number(e.amount || 0);
  const kind = popKind(e);
  if (kind === 'income') return Math.round(amount * POP_RATE.income);
  if (kind === 'black') return -Math.round(amount * POP_RATE.black);
  return Math.round(amount * POP_RATE.build);
}

function popStats() {
  let born = 0, lost = 0, tax = 0;
  entries.forEach(e => {
    const d = popDelta(e);
    const k = popKind(e);
    if (k === 'income') tax += d;
    else if (k === 'black') lost += d;
    else born += d;
  });
  return { total: POP_BASE + born + lost + tax, born, lost, tax, delta: born + lost + tax };
}

function popText(n) {
  return (Math.round(n / 1000) / 10).toFixed(1) + ' 万';
}

function fmtSigned(n) {
  return (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('zh-CN');
}

function popMood(delta) {
  if (delta > 0) return { cls: 'up', icon: '🌱', text: '人口净流入，城市在长大' };
  if (delta < 0) return { cls: 'down', icon: '⚠️', text: '人口净流失，治安在恶化' };
  return { cls: 'flat', icon: '🏙️', text: '人口稳定' };
}

/* ---------- 数字滚动 ---------- */

const prevValues = {};

const raf = window.requestAnimationFrame
  ? window.requestAnimationFrame.bind(window)
  : cb => setTimeout(() => cb(performance.now()), 16);

function animateNumber(render, from, to) {
  if (Math.abs(to - from) < 0.005) { render(to); return; }
  const dur = 420;
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    render(from + (to - from) * eased);
    if (p < 1) raf(frame);
    else render(to);
  }
  raf(frame);
  // 兜底：无论动画是否被节流，最终值一定会落地
  setTimeout(() => render(to), dur + 80);
}

/* ---------- 城邦评分 ---------- */

function cityScore() {
  const pop = popStats();
  const fac = facilityStats();
  const inc = total(entries.filter(e => e.type === 'income'));
  const out = total(entries.filter(e => e.type === 'expense'));
  const market = total(entries.filter(e => e.category === '购物'));
  // 建设是投资，不算“烧钱”；只有黑市这类消费才扣财政分
  const burn = total(entries.filter(e => e.type === 'expense' && !TAVERN_CATS.includes(e.category)));
  const vault = inc - burn;
  const lvSum = fac.reduce((a, f) => a + f.lv, 0);
  const maxLv = FACILITIES.length * FAC_LEVELS.length;

  const popScore = 30 * Math.max(0, Math.min(1, pop.total / POP_BASE));
  const facScore = maxLv ? 30 * Math.min(1, lvSum / maxLv) : 0;
  const finScore = inc > 0 ? 20 * Math.max(0, Math.min(1, vault / inc)) : 0;
  const blackRatio = out > 0 ? market / out : 0;
  const safeScore = 20 * Math.max(0, 1 - Math.min(1, blackRatio / 0.3));

  const totalScore = Math.round(popScore + facScore + finScore + safeScore);
  const grade = totalScore >= 90 ? 'S' : totalScore >= 75 ? 'A' : totalScore >= 60 ? 'B' : totalScore >= 40 ? 'C' : 'D';

  return {
    total: totalScore, grade: grade,
    parts: [
      { name: '人口', score: popScore, max: 30 },
      { name: '民生', score: facScore, max: 30 },
      { name: '财政', score: finScore, max: 20 },
      { name: '治安', score: safeScore, max: 20 }
    ],
    detail: { pop: pop.total, lvSum: lvSum, vault: vault, blackRatio: blackRatio }
  };
}

function scoreHTML() {
  const s = cityScore();
  return '<div class="score-card">' +
      '<div class="score-main"><span class="score-num">' + s.total + '</span>' +
        '<span class="score-grade grade-' + s.grade + '">' + s.grade + '</span></div>' +
      '<div class="score-label">城邦评分</div>' +
      '<div class="score-parts">' + s.parts.map(p =>
        '<div class="score-part"><span>' + p.name + '</span>' +
          '<div class="score-bar"><i style="width:' + Math.round(p.score / p.max * 100) + '%"></i></div>' +
          '<em>' + Math.round(p.score) + '/' + p.max + '</em></div>').join('') +
      '</div>' +
    '</div>';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawShareCard() {
  const W = 720, H = 960;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  let ctx = null;
  try { ctx = cv.getContext('2d'); } catch (e) { ctx = null; }
  if (!ctx) return null;

  const sc = cityScore();
  const pop = popStats();
  const fac = facilityStats();
  const city = $('cityName').value || '我的城邦';

  ctx.fillStyle = '#f3f1e6';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,0,0,.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 36) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.fillStyle = '#fffdf5';
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 5;
  roundRect(ctx, 30, 30, W - 60, H - 60, 36);
  ctx.fill(); ctx.stroke();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#2a2f3a';
  ctx.font = '700 40px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillText(city, W / 2, 110);
  ctx.font = '20px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillStyle = '#5b6373';
  ctx.fillText(todayISO(), W / 2, 146);

  ctx.fillStyle = '#2a2f3a';
  ctx.font = '700 150px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillText(String(sc.total), W / 2 - 30, 320);

  const gradeColor = { S: '#e0a020', A: '#2f8a58', B: '#4f8fd0', C: '#b0842f', D: '#d9523c' }[sc.grade];
  ctx.fillStyle = gradeColor;
  roundRect(ctx, W / 2 + 70, 210, 84, 84, 20);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 48px KuaiLe, sans-serif';
  ctx.fillText(sc.grade, W / 2 + 112, 268);

  ctx.fillStyle = '#5b6373';
  ctx.font = '22px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillText('城邦评分 · 满分 100', W / 2, 370);

  ctx.fillStyle = '#eef4e4';
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 4;
  roundRect(ctx, 70, 405, W - 140, 120, 24);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2f8a58';
  ctx.font = '700 44px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillText('人口 ' + popText(pop.total), W / 2, 470);
  ctx.fillStyle = '#5b6373';
  ctx.font = '20px KuaiLe, "PingFang SC", sans-serif';
  ctx.fillText(pop.total.toLocaleString('zh-CN') + ' 人', W / 2, 502);

  let y = 555;
  sc.parts.forEach(p2 => {
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2a2f3a';
    ctx.font = '700 24px KuaiLe, "PingFang SC", sans-serif';
    ctx.fillText(p2.name, 80, y);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#5b6373';
    ctx.font = '20px KuaiLe, sans-serif';
    ctx.fillText(Math.round(p2.score) + ' / ' + p2.max, W - 80, y);

    ctx.fillStyle = '#ece9d8';
    roundRect(ctx, 80, y + 12, W - 160, 14, 7);
    ctx.fill();
    const pct = Math.max(0.02, p2.score / p2.max);
    ctx.fillStyle = '#6cc25a';
    roundRect(ctx, 80, y + 12, (W - 160) * pct, 14, 7);
    ctx.fill();
    y += 58;
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#2a2f3a';
  ctx.font = '18px KuaiLe, "PingFang SC", sans-serif';
  const facRows = [];
  for (let i = 0; i < fac.length; i += 3) {
    facRows.push(fac.slice(i, i + 3).map(f => f.icon + f.name + ' Lv.' + f.lv).join('    '));
  }
  facRows.forEach((line, i) => ctx.fillText(line, W / 2, y + 46 + i * 30));

  ctx.fillStyle = '#8a8f9c';
  ctx.font = '18px KuaiLe, sans-serif';
  ctx.fillText('—— Where Is My Money', W / 2, H - 62);

  return cv;
}

function openShare() {
  SFX.open();
  const mask = document.createElement('div');
  mask.id = 'share-mask';
  mask.className = 'mask';
  mask.innerHTML =
    '<div class="modal share-modal">' +
      '<h3>生成分享卡</h3>' +
      '<div id="share-preview" class="share-preview"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn ok" id="share-download">保存图片</button>' +
        '<button class="btn" id="share-copy">复制文字</button>' +
        '<button class="btn" id="share-close">关闭</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(mask);

  const cv = drawShareCard();
  const preview = mask.querySelector('#share-preview');
  if (cv) {
    cv.style.width = '100%';
    cv.style.height = 'auto';
    cv.style.display = 'block';
    cv.style.borderRadius = '12px';
    preview.appendChild(cv);
  } else {
    preview.innerHTML = '<div class="empty">这个浏览器不支持生成图片，可以点「复制文字」。</div>';
  }

  mask.addEventListener('click', ev => {
    if (ev.target === mask) mask.remove();
  });
  mask.querySelector('#share-close').onclick = () => mask.remove();
  mask.querySelector('#share-copy').onclick = () => {
    const text = shareText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制，去粘贴吧')).catch(() => toast(text));
    } else {
      toast(text);
    }
  };
  mask.querySelector('#share-download').onclick = () => {
    if (!cv) { toast('当前浏览器不支持'); return; }
    cv.toBlob(blob => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '城邦卡片-' + todayISO() + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  };
}

const FACILITIES = [
  { key: 'hospital', icon: '🏥', name: '医院', weight: 0.25, desc: '看病、急救、接生' },
  { key: 'school', icon: '🏫', name: '学校', weight: 0.20, desc: '教孩子读书' },
  { key: 'road', icon: '🛣️', name: '道路', weight: 0.15, desc: '连接城市各处' },
  { key: 'police', icon: '🚓', name: '治安', weight: 0.15, desc: '守住夜里的城' },
  { key: 'power', icon: '⚡', name: '水电', weight: 0.15, desc: '让城市不停摆' },
  { key: 'park', icon: '🌳', name: '公园', weight: 0.10, desc: '留一点喘气的地方' }
];
const FAC_LEVELS = [1000, 5000, 15000, 40000, 100000, 250000];

function cityBuildSpend(monthOnly) {
  return total(entries.filter(e =>
    e.type === 'expense' && TAVERN_CATS.includes(e.category) &&
    (!monthOnly || (e.date || '').startsWith(currentMonth()))
  ));
}

function facilityStats() {
  const income = cityBuildSpend(false);  // 只有城市建设支出会投入民生
  return FACILITIES.map(f => {
    const fund = income * f.weight;
    let lv = 0;
    FAC_LEVELS.forEach(t => { if (fund >= t) lv += 1; });
    const prev = lv > 0 ? FAC_LEVELS[lv - 1] : 0;
    const next = lv < FAC_LEVELS.length ? FAC_LEVELS[lv] : null;
    const pct = next ? Math.max(2, Math.min(100, ((fund - prev) / (next - prev)) * 100)) : 100;
    return Object.assign({}, f, { fund: fund, lv: lv, next: next, pct: pct });
  });
}

function facilitiesHTML() {
  const list = facilityStats();
  return '<div class="list-title">民生建设</div>' +
    '<div class="fac-list">' + list.map(f =>
      '<div class="fac">' +
        '<span class="fac-icon">' + f.icon + '</span>' +
        '<div class="fac-main">' +
          '<div class="fac-head"><b>' + f.name + '</b><em>Lv.' + f.lv + '</em></div>' +
          '<small>' + f.desc + ' · 累计 ' + money(f.fund) + '</small>' +
          '<div class="fac-bar"><i style="width:' + f.pct.toFixed(1) + '%"></i></div>' +
          '<span class="fac-next">' + (f.next ? '下一级还需 ' + money(Math.max(0, f.next - f.fund)) : '已满级') + '</span>' +
        '</div>' +
      '</div>').join('') + '</div>' +
    '<p class="hint">本月城市建设 ' + money(cityBuildSpend(true)) +
    ' 会按比例自动投入：医院 25%、学校 20%、道路 15%、治安 15%、水电 15%、公园 10%。收入本身不直接进民生，要先花在建设上。</p>';
}

/* ---------- 首页 ---------- */

function home() {
  const a = monthEntries(currentMonth());
  const inc = total(a.filter(x => x.type === 'income'));
  const out = total(a.filter(x => x.type === 'expense'));
  const pending = hesitations.filter(h => !h.done);
  const values = {
    homes: inc,
    tavern: cityTotal(a),
    vault: inc - out,
    market: sumCat(a, '购物'),
    hesitate: pending.reduce((s2, h) => s2 + Number(h.amount || 0), 0)
  };

  const marketRatio = inc > 0 ? values.market / inc : 0;
  const mood = {
    homes: inc === 0 ? 'idle' : 'good',
    tavern: out > inc && out > 0 ? 'danger' : '',
    vault: values.vault < 0 ? 'danger' : (values.vault > 0 ? 'good' : 'idle'),
    market: marketRatio > 0.15 ? 'danger' : (values.market > 0 ? 'pulse' : ''),
    hesitate: pending.length ? 'pulse' : ''
  };

  $('buildings').innerHTML = Object.entries(cfg).map(([k, c]) =>
    '<button class="building ' + (k === 'market' ? 'market' : '') + ' ' + (mood[k] || '') + '" onclick="openView(\'' + k + '\')">' +
      '<i>' + c.icon + '</i><b>' + c.name + '</b><small>' + c.sub + '</small>' +
      '<div class="value">' + (k === 'vault' ? '结余 ' : '') + money(values[k]) + '</div>' +
      (k === 'hesitate' && pending.length ? '<span class="badge">' + pending.length + ' 笔纠结中</span>' : '') +
    '</button>').join('');

  let ev;
  if (!a.length) ev = '【城邦待命】从第一笔收入或消费开始建设吧。';
  else if (values.market > Math.max(inc * 0.15, 300)) ev = '【城邦事件】黑市交易频繁，治安值正在下降。';
  else if (values.vault < 0) ev = '【城邦事件】金库见底，这个月要开始节流了。';
  else ev = '【城邦事件】城邦平稳运作中。金库的结余将决定下月的安全感。';
  $('event').textContent = ev;

  renderPopBar();

  // 数字滚动
  Object.keys(values).forEach(k => {
    const card = document.querySelector('.building[onclick*="' + k + '"]');
    if (!card) return;
    const el = card.querySelector('.value');
    if (!el) return;
    const prev = prevValues[k] === undefined ? 0 : prevValues[k];
    const prefix = k === 'vault' ? '结余 ' : '';
    const render = v => { el.textContent = prefix + money(v); };
    animateNumber(render, prev, values[k]);
    prevValues[k] = values[k];
  });
}

  $('detail').classList.remove('active');
  $('home').style.display = 'block';
  home();
  animateIn($('home'), 'back');
}

function rowsFor(a) {
  if (mode === 'vault') return a;
  if (PARTS[mode]) return a.filter(x => x.type === cfg[mode].type && x.category === activeParts[mode]);
  const c = cfg[mode];
  return a.filter(x => x.type === c.type && c.cats.includes(x.category));
}

function statsHTML(a, rows) {
  const inc = total(a.filter(x => x.type === 'income'));
  const out = total(a.filter(x => x.type === 'expense'));

  if (mode === 'vault') {
    return '<div class="stats">' +
      '<div class="stat"><span>本月收入</span><strong class="income">' + money(inc) + '</strong></div>' +
      '<div class="stat"><span>本月支出</span><strong class="expense">' + money(out) + '</strong></div>' +
      '<div class="stat"><span>可投入金库</span><strong>' + money(inc - out) + '</strong></div></div>';
  }


  return '<div class="stats"><div class="stat"><span>本月' + cfg[mode].sub + '</span><strong class="' + cfg[mode].type + '">' + money(total(rows)) + '</strong></div>' +
    '<div class="stat"><span>本月记录</span><strong>' + rows.length + ' 笔</strong></div></div>';
}

function tableHTML(rows) {
  const sorted = rows.slice().sort((x, y) => String(y.date).localeCompare(String(x.date)) || y.id - x.id);
  if (!sorted.length) return '<div class="empty">这里还没有记录</div>';
  return '<table><thead><tr><th>日期</th><th>分类 / 备注</th><th style="text-align:right">金额</th><th></th></tr></thead><tbody>' +
    sorted.map(x =>
      '<tr><td>' + x.date.slice(5) + '</td><td>' + labelFor(x.category) + (x.sub ? ' · ' + safe(x.sub) : '') + (x.note ? ' · ' + safe(x.note) : '') +
      '</td><td class="amount ' + x.type + '">' + (x.type === 'income' ? '+' : '-') + money(x.amount) +
      '</td><td><button class="del" title="删除" onclick="removeEntry(' + x.id + ')">×</button></td></tr>').join('') +
    '</tbody></table>';
}

function render() {
  if (!mode) return;
  const c = cfg[mode];
  const a = monthEntries(currentMonth());

  $('title').textContent = c.icon + ' ' + c.name;
  $('desc').textContent = c.desc;
  $('monthbar').style.display = mode === 'hesitate' ? 'none' : 'flex';

  if (mode === 'hesitate') {
    $('stats').innerHTML = hesitateStats();
    $('editor').innerHTML = hesitateForm();
    $('listTitle').textContent = hesitations.filter(h => !h.done).length ? '纠结清单' : '';
    $('records').innerHTML = hesitateList();
    $('recurring').innerHTML = '';
    return;
  }

  if (PARTS[mode]) {
    // 每个 part 各自独立，展开的内容长在它自己下面
    $('stats').innerHTML = PARTS[mode].map(cat => partBlock(cat, a, mode)).join('');
    $('editor').innerHTML = '';
    $('listTitle').textContent = '';
    $('records').innerHTML = '';
    $('recurring').innerHTML = '';
    return;
  }

  const rows = rowsFor(a);
  $('stats').innerHTML = statsHTML(a, rows);
  $('editor').innerHTML = mode === 'vault' ? ''
    : (mode === 'market' ? quickForm() : form(c));
  const empty = rows.length === 0;
  $('listTitle').textContent = empty && mode === 'market' ? '' : (mode === 'vault' ? '本月所有账目' : '本月记录');
  $('records').innerHTML = empty && mode === 'market' ? '' : tableHTML(rows);
  $('recurring').innerHTML = '';
}

function partBlock(cat, a, view) {
  const rows = a.filter(x => x.type === cfg[view].type && x.category === cat);
  const open = activeParts[view] === cat;
  const sub = PART_SUB[cat] || '';

  const panel = open
    ? '<div class="part-panel">' +
        (view === 'tavern' && cat === '例行建设' ? recurringHTML() : '') +
        form(cfg[view], cat, true) +
        '<div class="list-title">本月记录</div>' +
        tableHTML(rows) +
      '</div>'
    : '';

  return '<section class="part-block' + (open ? ' open' : '') + '">' +
    '<button type="button" class="part" onclick="pickPart(\'' + cat + '\')">' +
      '<span class="part-main"><b>' + cat + '</b><small>' + sub + '</small></span>' +
      '<span class="part-value">' + money(total(rows)) + '<em>' + rows.length + ' 笔</em></span>' +
      '<span class="part-caret">' + (open ? '▾' : '▸') + '</span>' +
    '</button>' + panel + '</section>';
}

function pickPart(cat) {
  // 点同一个就收起，点别的就切过去
  activeParts[mode] = activeParts[mode] === cat ? '' : cat;
  render();
}

const HES_CHIPS = [[10, '10 分钟'], [30, '30 分钟'], [60, '1 小时'], [1440, '1 天']];
let hesFlow = { step: 'title', draft: {}, log: [], result: '' };

function hesReset() {
  hesFlow = { step: 'title', draft: {}, log: [], result: '' };
}

function formatLeft(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  if (m > 0) return m + ' 分 ' + pad(sec) + ' 秒';
  return sec + ' 秒';
}

function monthSaved() {
  const ym = currentMonth();
  return savedMoney.filter(x => String(x.date || '').startsWith(ym));
}

function hesitateStats() {
  const pending = hesitations.filter(h => !h.done);
  const pendingMoney = pending.reduce((s2, h) => s2 + Number(h.amount || 0), 0);
  const kept = monthSaved();
  return '<div class="hes-summary">纠结 <b>' + pending.length + '</b> 笔 · ' + money(pendingMoney) +
    '　本月守住 <b>' + money(total(kept)) + '</b>（' + kept.length + ' 笔）</div>';
}

function hesitateForm() {
  const f = hesFlow;
  let bubbles = f.log.map(m => '<div class="bubble ' + m.who + '">' + safe(m.text) + '</div>').join('');

  if (f.step === 'title') bubbles += '<div class="bubble bot">想买什么？先扔进来冷静一下。</div>';
  if (f.step === 'amount') bubbles += '<div class="bubble bot">「' + safe(f.draft.title) + '」，多少钱？</div>';
  if (f.step === 'duration') bubbles += '<div class="bubble bot">打算冷静多久？</div>';
  if (f.step === 'done') bubbles += '<div class="bubble bot">' + f.result + '</div>';

  let input = '';
  if (f.step === 'title') {
    input = '<form onsubmit="chatSubmit(event)"><input name="v" placeholder="比如：一双球鞋" autocomplete="off" required><button type="submit">→</button></form>';
  } else if (f.step === 'amount') {
    input = '<form onsubmit="chatSubmit(event)"><input name="v" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required><button type="submit">→</button></form>';
  } else if (f.step === 'duration') {
    input = '<div class="chips">' +
      HES_CHIPS.map(([m, label]) => '<button type="button" onclick="chatDuration(' + m + ')">' + label + '</button>').join('') +
      '<button type="button" class="ghost" onclick="chatCustom()">自定义</button></div>';
  } else if (f.step === 'custom') {
    input = '<form onsubmit="chatCustomSubmit(event)"><input name="v" type="number" min="1" step="1" inputmode="numeric" placeholder="分钟数" required><button type="submit">→</button></form>';
  } else if (f.step === 'done') {
    input = '<div class="chips"><button type="button" onclick="hesAgain()">再记一个</button><button type="button" class="ghost" onclick="openCity()">看城市</button></div>';
  }

  return '<div class="chat">' + bubbles + '<div class="chat-input">' + input + '</div></div>';
}

function chatSubmit(e) {
  e.preventDefault();
  const v = (new FormData(e.target).get('v') || '').toString().trim();
  if (!v) return;
  const f = hesFlow;
  if (f.step === 'title') {
    f.draft.title = v;
    f.log.push({ who: 'me', text: v });
    f.step = 'amount';
  } else if (f.step === 'amount') {
    const amount = Number(v);
    if (!(amount > 0)) { toast('金额要大于 0 哦'); return; }
    f.draft.amount = amount;
    f.log.push({ who: 'me', text: '¥' + amount });
    f.step = 'duration';
  }
  SFX.click();
  render();
}

function chatDuration(minutes) {
  const f = hesFlow;
  f.log.push({ who: 'me', text: '冷静 ' + minutes + ' 分钟' });
  startHesitation(minutes);
}

function chatCustom() {
  hesFlow.step = 'custom';
  SFX.click();
  render();
}

function chatCustomSubmit(e) {
  e.preventDefault();
  const v = Number(new FormData(e.target).get('v'));
  if (!(v > 0)) { toast('填个分钟数'); return; }
  hesFlow.log.push({ who: 'me', text: '冷静 ' + v + ' 分钟' });
  startHesitation(v);
}

function startHesitation(minutes) {
  const f = hesFlow;
  const now = Date.now();
  hesitations.unshift({
    id: uid(),
    title: f.draft.title || '想买的东西',
    amount: f.draft.amount || 0,
    note: '',
    minutes: minutes,
    startAt: now,
    dueAt: now + minutes * 60000,
    done: false
  });
  save();
  SFX.coin();
  f.step = 'done';
  f.result = '好，开始计时 ' + minutes + ' 分钟。到点我会来问你「买了还是算了」。';
  f.log = [];
  render();
}

function hesAgain() {
  hesReset();
  render();
}

function hesitateList() {
  const pending = hesitations.filter(h => !h.done).sort((a, b) => a.dueAt - b.dueAt);
  const kept = monthSaved();

  let html = '';
  if (pending.length) {
    html += pending.map(h => {
      const left = h.dueAt - Date.now();
      const due = left <= 0;
      return '<div class="hes-item' + (due ? ' due' : '') + '">' +
        '<div class="hes-main"><b>' + safe(h.title) + '</b>' +
        '<small>' + money(h.amount) + (h.note ? ' · ' + safe(h.note) : '') + ' · 冷静 ' + h.minutes + ' 分钟' +
        (due ? ' · <b class="due-tag">时间到</b>' : ' · <span class="countdown" data-due="' + h.dueAt + '">还剩 ' + formatLeft(left) + '</span>') +
        '</small></div>' +
        '<div class="hes-side">' +
          (due
            ? '<button class="btn ok" onclick="doHesitation(' + h.id + ')">买了</button>' +
              '<button class="btn no" onclick="skipHesitation(' + h.id + ')">算了</button>'
            : '<button class="btn tiny" onclick="endHesitationEarly(' + h.id + ')">提前结束</button>' +
              '<button class="del" title="取消" onclick="cancelHesitation(' + h.id + ')">×</button>') +
        '</div></div>';
    }).join('');
  } else if (!kept.length) {
    return '';
  }

  if (kept.length) {
    html += '<div class="list-title" style="margin-top:22px">本月守住的消费 🎉</div>' +
      '<div class="kept-list">' + kept.slice().reverse().map(x =>
        '<div class="kept-item"><span>' + safe(x.title) + '</span><b>' + money(x.amount) + '</b></div>').join('') + '</div>';
  }
  return html;
}

function addHesitation(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const amount = Number(f.get('amount'));
  const minutes = Math.round(Number(f.get('duration')) * Number(f.get('unit')));
  if (!(amount > 0)) { alert('金额要大于 0 哦'); return; }
  const now = Date.now();
  hesitations.unshift({
    id: uid(),
    title: (f.get('title') || '').trim() || '想买的东西',
    amount,
    note: (f.get('note') || '').trim(),
    minutes,
    startAt: now,
    dueAt: now + minutes * 60000,
    done: false
  });
  save();
  render();
}

function doHesitation(id) {
  const h = hesitations.find(x => x.id === id);
  if (!h) return;
  showTypeChooser(h);
}

function showTypeChooser(h) {
  if (document.getElementById('type-mask')) return;
  const mask = document.createElement('div');
  mask.id = 'type-mask';
  mask.className = 'mask';
  mask.innerHTML =
    '<div class="modal">' +
      '<h3>这笔算哪一类？</h3>' +
      '<p class="modal-title">' + safe(h.title) + '</p>' +
      '<p class="modal-amount">' + money(h.amount) + '</p>' +
      '<p class="modal-ask">记到「城市建设」会帮城市发展、涨人口和民生；记到「黑市」会掉治安和人口。</p>' +
      '<div class="modal-actions">' +
        '<button class="btn ok" data-kind="tavern">算城市建设</button>' +
        '<button class="btn no" data-kind="market">算黑市消费</button>' +
        '<button class="btn" data-kind="cancel">先不记</button>' +
      '</div>' +
    '</div>';
  mask.addEventListener('click', ev => {
    const kind = ev.target && ev.target.dataset ? ev.target.dataset.kind : '';
    if (!kind) return;
    mask.remove();
    if (kind === 'cancel') return;
    commitHesitation(h.id, kind);
  });
  document.body.appendChild(mask);
}

function commitHesitation(id, kind) {
  const h = hesitations.find(x => x.id === id);
  if (!h) return;
  hesitations = hesitations.filter(x => x.id !== id);
  save();
  const note = h.title + (h.note ? ' · ' + h.note : '');
  SFX.coin();

  if (kind === 'tavern') {
    activeParts.tavern = '本邦建设';
    openView('tavern');
    render();
    const form = document.querySelector('#stats .part-panel form');
    if (form) {
      form.querySelector('[name=amount]').value = h.amount;
      form.querySelector('[name=note]').value = note;
      form.querySelector('[name=amount]').focus();
    }
  } else {
    openView('market');
    const form = document.querySelector('form.quick');
    if (form) {
      form.querySelector('[name=amount]').value = h.amount;
      form.querySelector('[name=note]').value = note;
      form.querySelector('[name=amount]').focus();
    }
  }
}

function skipHesitation(id) {
  const h = hesitations.find(x => x.id === id);
  if (!h) return;
  hesitations = hesitations.filter(x => x.id !== id);
  savedMoney.push({ id: uid(), title: h.title, amount: h.amount, date: todayISO() });
  save();
  SFX.win();
  render();
  toast('守住了 ' + money(h.amount) + '，这笔没花 👏');
}

function endHesitationEarly(id) {
  const h = hesitations.find(x => x.id === id);
  if (!h) return;
  h.dueAt = Date.now() - 1000;
  askedDue.add(id);
  save();
  SFX.click();
  render();
  showDecision(h);
}

function cancelHesitation(id) {
  if (!confirm('取消这条纠结记录？')) return;
  SFX.nope();
  hesitations = hesitations.filter(x => x.id !== id);
  save();
  render();
}

const askedDue = new Set();

function tickCountdowns() {
  if (!hesitations.length) return;
  let needRender = false;

  // 到点自动弹窗问一次
  hesitations.forEach(h => {
    if (!h.done && h.dueAt <= Date.now() && !askedDue.has(h.id)) {
      askedDue.add(h.id);
      showDecision(h);
      needRender = true;
    }
  });

  // 更新倒计时文字
  document.querySelectorAll('[data-due]').forEach(el => {
    const left = Number(el.dataset.due) - Date.now();
    if (left > 0) el.textContent = '还剩 ' + formatLeft(left);
    else needRender = true;
  });

  if (needRender && mode === 'hesitate') render();
}

function showDecision(h) {
  if (document.getElementById('decision-mask')) return;
  SFX.warn();
  const mask = document.createElement('div');
  mask.id = 'decision-mask';
  mask.className = 'mask';
  mask.innerHTML =
    '<div class="modal">' +
      '<h3>⏳ 冷静期结束了</h3>' +
      '<p class="modal-title">' + safe(h.title) + '</p>' +
      '<p class="modal-amount">' + money(h.amount) + '</p>' +
      '<p class="modal-ask">还想买吗？买了之后你可以选记到「城市建设」还是「黑市」；算了就记一笔守住的消费。</p>' +
      '<div class="modal-actions">' +
        '<button class="btn ok" data-act="buy">买了</button>' +
        '<button class="btn no" data-act="skip">算了，不买了</button>' +
        '<button class="btn" data-act="later">再等 10 分钟</button>' +
      '</div>' +
    '</div>';
  mask.addEventListener('click', ev => {
    const act = ev.target && ev.target.dataset ? ev.target.dataset.act : '';
    if (!act) return;
    mask.remove();
    if (act === 'buy') doHesitation(h.id);
    else if (act === 'skip') skipHesitation(h.id);
    else snoozeHesitation(h.id);
  });
  document.body.appendChild(mask);
}

function snoozeHesitation(id) {
  const h = hesitations.find(x => x.id === id);
  if (!h) return;
  h.dueAt = Date.now() + 10 * 60000;
  askedDue.delete(id);
  save();
  render();
  toast('再给你 10 分钟');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function labelFor(cat) {
  return (cfg.tavern.labels && cfg.tavern.labels[cat]) || cat;
}

function recurringHTML() {
  if (!recurring.length) return '';
  return '<div class="list-title" style="margin-top:24px">例行建设（每月自动入账）</div>' +
    '<div class="recurring-list">' + recurring.map(r =>
      '<div class="recurring-item"><span>' + money(r.amount) + ' · 每月 ' + r.day + ' 号' + (r.note ? ' · ' + safe(r.note) : '') + '</span>' +
      '<button class="del" onclick="removeRecurring(\'' + r.id + '\')">删除</button></div>').join('') + '</div>';
}

function quickForm() {
  return '<form class="quick" onsubmit="addMarket(event)">' +
      '<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="金额" required>' +
      '<input name="note" maxlength="36" placeholder="备注（可选）">' +
      '<input name="date" type="date" value="' + todayISO() + '" required>' +
      '<button class="save">添加</button>' +
    '</form>';
}

function form(c, forcedCat, bare) {
  const construction = mode === 'tavern';
  const currentCat = forcedCat || (PARTS[mode] ? activeParts[mode] : c.cats[0]);
  const fixed = Boolean(forcedCat) || construction || c.cats.length === 1;
  const category = fixed
    ? '<input type="hidden" name="category" value="' + currentCat + '">'
    : '<div><label>分类</label><select name="category">' +
      c.cats.map(x => '<option value="' + x + '">' + (c.labels && c.labels[x] || x) + '</option>').join('') + '</select></div>';

  const title = mode === 'homes' ? '税收记录' : construction ? '建设记录' : '添加记录';
  const event = mode === 'homes' && taxEvent ? '<span class="tax-event">' + taxEvent + '</span>' : '';
  const subcats = PART_SUBCATS[currentCat] || [];
  const subControl = subcats.length
    ? '<div><label>具体来源</label><select name="sub">' +
      subcats.map(x => '<option value="' + x + '">' + x + '</option>').join('') + '</select></div>'
    : '';

  const recurringControl = construction && currentCat === '例行建设'
    ? '<label class="recurring-toggle"><input name="recurring" type="checkbox" checked> 每月自动加入（固定支出）</label>' : '';

  const formHTML = '<form class="entry ' + (fixed ? 'compact' : '') + ' ' + (construction ? 'construction' : '') + '" onsubmit="addEntry(event)">' +
      '<div><label>金额</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0.00"></div>' +
      category + subControl +
      '<div><label>日期</label><input name="date" type="date" value="' + todayISO() + '" required></div>' +
      '<div class="wide"><label>备注 <span>（可选）</span></label><input name="note" maxlength="36" placeholder="写下用途，方便回顾"></div>' +
      recurringControl +
      '<button class="save">添加</button></form>';

  return bare ? formHTML : '<div class="entry-card"><div class="form-title">' + title + event + '</div>' + formHTML + '</div>';
}

/* ---------- 增删 ---------- */

function addEntry(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const amount = Number(f.get('amount'));
  if (!(amount > 0)) { alert('金额要大于 0 哦'); return; }

  const c = cfg[mode];
  const entry = {
    id: uid(),
    type: c.type,
    amount,
    category: PARTS[mode] ? activeParts[mode] : f.get('category'),
    date: f.get('date'),
    note: (f.get('note') || '').trim(),
    sub: (f.get('sub') || '').trim()
  };

  if (mode === 'tavern' && activeParts.tavern === '例行建设' && f.get('recurring') === 'on') {
    const rid = 'r' + uid();
    entry.category = '例行建设';
    entry.recurringId = rid;
    recurring.push({ id: rid, amount: entry.amount, day: Number(entry.date.slice(-2)), note: entry.note, startMonth: entry.date.slice(0, 7) });
  }

  entries.unshift(entry);
  SFX.coin();
  const d = popDelta(entry);
  if (d !== 0) {
    const up = d > 0;
    toast((up ? '🌱 城市扩建，人口 ' : '⚠️ 黑市交易，人口 ') + fmtSigned(d) + ' 人');
  }
  taxEvent = mode === 'homes' ? TAX_EVENTS[Math.floor(Math.random() * TAX_EVENTS.length)] : '';
  save();
  render();
}

function removeEntry(id) {
  const item = entries.find(x => x.id === id);
  if (!item) return;
  SFX.click();
  if (item.recurringId) {
    if (!confirm('这条属于「例行建设」，删除会同时移除它的所有月份记录，确定吗？')) return;
    recurring = recurring.filter(x => x.id !== item.recurringId);
    entries = entries.filter(x => x.recurringId !== item.recurringId);
  } else {
    if (!confirm('删除这条记录？')) return;
    entries = entries.filter(x => x.id !== id);
  }
  save();
  render();
}

function removeRecurring(rid) {
  if (!confirm('删除这个例行建设？已产生的记录也会一起移除。')) return;
  recurring = recurring.filter(x => x.id !== rid);
  entries = entries.filter(x => x.recurringId !== rid);
  save();
  render();
}

/* ---------- 月份 / 备份 ---------- */

function shiftMonth(delta) {
  const cur = currentMonth();
  const [y, m] = cur.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  $('month').value = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  refresh();
}

function backToNow() {
  updateSoundBtn();
// 入场动画在「进入」时播放，落地页阶段先不触发
var soundBtn = $('sound');
if (soundBtn) soundBtn.onclick = toggleSound;

scheduleDayRollover();

document.addEventListener('visibilitychange', () => { if (!document.hidden) renderToday(); });

$('month').value = todayISO().slice(0, 7);

function refresh() {
  if ($('detail').classList.contains('active')) render(); else home();
}

function exportData() {
  const blob = new Blob([JSON.stringify({ version: 3, exportedAt: new Date().toISOString(), entries, recurring, hesitations, savedMoney, city: $('cityName').value }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '城邦账本-' + todayISO() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.entries)) throw new Error('格式不对');
      if (!confirm('导入会用文件里的数据覆盖当前账本，确定？')) return;
      entries = data.entries;
      recurring = Array.isArray(data.recurring) ? data.recurring : [];
      hesitations = Array.isArray(data.hesitations) ? data.hesitations : [];
      savedMoney = Array.isArray(data.savedMoney) ? data.savedMoney : [];
      if (data.city) { $('cityName').value = data.city; storage.setItem(KEY.city, data.city); }
      save();
      refresh();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function clearAll() {
  if (!confirm('确定清空所有账目和例行建设？这一步不能撤销。')) return;
  if (!confirm('真的确定？建议先导出一份备份。')) return;
  entries = [];
  recurring = [];
  save();
  refresh();
}

/* ---------- 工具 ---------- */

function safe(s) {
  return String(s).replace(/[&<>'"]/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[x]));
}

/* ---------- 顶部日期 ---------- */

function renderToday() {
  const t = beijingNow();
  const el = $('today');
  if (el) el.textContent = t.y + '年' + t.m + '月' + t.d + '日';
}

function scheduleDayRollover() {
  // 距离下一个北京时间 0 点还有多久，到点刷新一次再排下一次
  const now = Date.now();
  const bj = new Date(now + 8 * 3600 * 1000);
  const nextMidnightBj = Date.UTC(bj.getUTCFullYear(), bj.getUTCMonth(), bj.getUTCDate() + 1) - 8 * 3600 * 1000;
  const wait = Math.max(1000, nextMidnightBj - now + 500);
  setTimeout(() => { renderToday(); scheduleDayRollover(); }, wait);
}

/* ---------- 页面切换动画 ---------- */

function visibleScreen() {
  const v = document.querySelector('.view.active');
  if (v) return v;
  const h = document.getElementById('home');
  return h && h.style.display !== 'none' ? h : null;
}

function ghostOut(el, dir) {
  if (!el) return;
  try {
    const r = el.getBoundingClientRect();
    const ghost = el.cloneNode(true);
    // 去掉 id 和 active，避免和真实页面冲突
    ghost.removeAttribute('id');
    ghost.classList.remove('active');
    Array.prototype.forEach.call(ghost.querySelectorAll('[id]'), function (n) { n.removeAttribute('id'); });
    ghost.setAttribute('data-ghost', '1');
    ghost.classList.add('ghost-out-' + dir);
    ghost.style.position = 'fixed';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px';
    ghost.style.margin = '0';
    ghost.style.pointerEvents = 'none';
    ghost.style.zIndex = '150';
    document.body.appendChild(ghost);
    setTimeout(function () { ghost.remove(); }, 340);
  } catch (e) { /* 忽略 */ }
}

function animateIn(el, dir) {
  if (!el) return;
  const cls = 'screen-in-' + dir;
  el.classList.remove('screen-in-forward', 'screen-in-back');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function () { el.classList.remove(cls); }, 460);
}

  }, 500);
}

const HOVER_SEL = '.landing-enter, .building, .part, .btn, .back, .city-tab, .save, .score-pill, .city-link, .chips button, .toolbar button, .toolbar label, .del, .sound-btn';
let lastHover = 0;
document.addEventListener('mouseover', function (e) {
  const el = e.target && e.target.closest ? e.target.closest(HOVER_SEL) : null;
  if (!el) return;
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  const now = Date.now();
  if (now - lastHover < 60) return;
  lastHover = now;
  SFX.hover();
});
